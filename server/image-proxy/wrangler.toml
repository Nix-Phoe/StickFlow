# Proxy d'images de StickFlow (Cloudflare Worker). Déploiement : voir README.md.
name = "stickflow-image-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Origines autorisées (adresse de l'app), séparées par des virgules. « * » : toutes (déconseillé).
ALLOWED_ORIGINS = "http://localhost:5173"

# La clé d'API n'est jamais écrite ici : `npx wrangler secret put PEXELS_API_KEY`
# (en local : fichier .dev.vars, ignoré par git, voir .dev.vars.example).
